<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>我是一个测试页面</h2>
    <button id="btn">按钮</button>
    <div id="content"></div>
    <script>
        btn = document.getElementById("btn");
        btn.onclick = async function (){
            res = await fetch("http://localhost:8000/send_emil?session_id=123456")
            data = await res.json();
            console.log(data)

            es = new EventSource("http://localhost:8000/ssestream?session_id=123456")
            es.onmessage = function (e){
                console.log(e.data)
                if(e.data !== "None"){
                    document.getElementById("content").innerHTML += (e.data + '<br>');
                }else{
                    es.close();
                }

            }

        }

    </script>
</body>
</html>
