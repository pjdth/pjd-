<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>发邮件</title>
</head>
<body>
    <h1>要发送邮件吗</h1>
    <button id="btn">发送邮件</button>
    <div id="content"></div>
    <script>
        btn = document.getElementById("btn");
        btn.onclick = async function () {
            res = await fetch("http://192.168.5.40:8000/send_message?session_id=123456")
            data = await res.json();
            console.log(data)

            es = new EventSource("http://192.168.5.40:8000/ssestream?session_id=123456")
            es.onmessage = function (e) {
                console.log(e.data)
                if (e.data !== "None") {
                    document.getElementById("content").innerHTML += (e.data + '<br>');
                } else {
                    es.close();
                }
            }
        }
    </script>
</body>
</html>
